name: CI - Cloud Price Tracker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-ci:
    name: Frontend Build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Compilar Angular
        run: bun run build

  backend-ci:
    name: Backend Check (Node/Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Verificar compilación TypeScript
        run: bun build src/index.ts --outdir dist --target bun

  docker-build-check:
    name: Verificar Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: price-tracker-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen Worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          tags: price-tracker-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
