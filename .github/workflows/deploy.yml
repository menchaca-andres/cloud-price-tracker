name: CD - Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REGISTRY: 834788437299.dkr.ecr.us-east-1.amazonaws.com
  EC2_HOST: 52.200.215.119

jobs:
  deploy-backend-and-worker:
    name: Build ECR & Deploy EC2
    runs-on: ubuntu-latest
    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4
    
    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build y Push Backend a ECR (amd64)
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        platform: linux/amd64
        push: true
        tags: ${{ env.ECR_REGISTRY }}/price-tracker-backend:latest

    - name: Build y Push Worker a ECR (amd64)
      uses: docker/build-push-action@v6
      with:
        context: ./worker
        platform: linux/amd64
        push: true
        tags: ${{ env.ECR_REGISTRY }}/price-tracker-worker:latest

    - name: Desplegar en EC2 vía SSH
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/ec2_key.pem
        chmod 600 ~/.ssh/ec2_key.pem
        scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem docker-compose.prod.yml ubuntu@${{ env.EC2_HOST }}:~/docker-compose.prod.yml
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ubuntu@${{ env.EC2_HOST }} << 'EOF'
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 834788437299.dkr.ecr.us-east-1.amazonaws.com
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d backend
          docker image prune -f
        EOF

  deploy-frontend:
    name: Build Angular & Sync to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias y compilar Angular
        working-directory: frontend
        run: |
          bun install
          bun run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Subir archivos estáticos a Amazon S3
        run:
          aws s3 sync frontend/dist/frontend/browser s3://${{ secrets.S3_BUCKET_NAME }} --delete
          